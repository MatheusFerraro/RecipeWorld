services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8080:8080
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RecipeWorldConnectionString: "Server=db,1433;Database=WorldRecipeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      ImageUpload__StoragePath: /app/uploads/recipes
      UseHttpsRedirection: "false"
      SeedData__DemoPassword: ${DEMO_PASSWORD:-Demo123!}
      SeedData__AdminPassword: ${ADMIN_PASSWORD:-}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (at least 32 characters)}
    volumes:
      - recipe-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  recipe-uploads:
  mssql-data:
